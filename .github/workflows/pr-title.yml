name: pr-title
on:
  # Needed so pull requests from forks are checked too. Safe here: the job checks out and runs no
  # pull request code, and its token can only read pull requests.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, synchronize, reopened]
permissions:
  pull-requests: read
jobs:
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pull requests are squash-merged, so the title becomes the commit subject.
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
